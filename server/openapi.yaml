openapi: 3.1.0
info:
  title: 小明智能体任务 API
  version: 1.1.0
servers:
  - url: http://127.0.0.1:3000
paths:
  /api/tasks:
    get:
      operationId: listTasks
      summary: 按创建顺序列出全部任务，包括已完成任务
      responses:
        "200":
          description: 任务列表；空列表为 []
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Task" }
    post:
      operationId: createTask
      summary: 创建一条未完成任务，可附带到期日、优先级、工作量和父任务
      description: 子任务未指定到期日时复制当时的父日期；新增孩子会重算父完成状态。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [title]
              properties:
                title: { $ref: "#/components/schemas/Title" }
                dueDate: { $ref: "#/components/schemas/DueDate" }
                priority: { $ref: "#/components/schemas/Priority" }
                workload: { $ref: "#/components/schemas/Workload" }
                effort: { $ref: "#/components/schemas/Effort" }
                parentId: { type: string, description: 已存在的顶层父任务 id；仅支持父子两层 }
      responses:
        "201":
          description: 新建的任务
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "400": { $ref: "#/components/responses/BadRequest" }
  /api/tasks/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    patch:
      operationId: updateTask
      summary: 修改标题、完成状态或扩展属性
      description: 完成父任务会完成孩子，全孩子完成会完成父任务；撤销子任务会撤销父完成，撤销父任务不改孩子。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              additionalProperties: false
              properties:
                title: { $ref: "#/components/schemas/Title" }
                done: { type: boolean }
                dueDate: { $ref: "#/components/schemas/DueDate" }
                priority: { $ref: "#/components/schemas/Priority" }
                workload: { $ref: "#/components/schemas/Workload" }
                effort: { $ref: "#/components/schemas/Effort" }
                parentId: { type: string }
      responses:
        "200":
          description: 更新后的任务
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteTask
      summary: 删除一条任务及其全部后代（含历史深层关系）
      responses:
        "204":
          description: 删除成功，响应体为空
        "404": { $ref: "#/components/responses/NotFound" }
components:
  schemas:
    Title:
      type: string
      description: 首尾空白会自动去除，去除后长度应为 1 至 200
      minLength: 1
      maxLength: 200
    DueDate:
      type: string
      format: date
      pattern: '^\d{4}-\d{2}-\d{2}$'
      description: 有效的日历日期，校验月份、天数和闰年
    Priority:
      type: string
      enum: [high, medium, low]
    Workload:
      type: string
      enum: [small, medium, large]
    Effort:
      type: string
      enum: [small, medium, large]
      description: workload 的输入别名，写入时统一归一化为 workload；同时提供时值必须相同
    Task:
      type: object
      required: [id, title, done]
      properties:
        id: { type: string, format: uuid }
        title: { $ref: "#/components/schemas/Title" }
        done: { type: boolean }
        dueDate: { $ref: "#/components/schemas/DueDate" }
        priority: { $ref: "#/components/schemas/Priority" }
        workload: { $ref: "#/components/schemas/Workload" }
        parentId: { type: string }
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
  responses:
    BadRequest:
      description: 请求字段无效
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: 任务不存在
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
